# Promtail：通过 docker socket 采集容器 stdout → 推送 Loki。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 只采集我们的应用容器（container_name=langchin-agent）
      - source_labels: ['__meta_docker_container_name']
        regex: 'langchin-agent'
        action: keep
      # 用容器名作为日志标签，方便 Grafana 按容器过滤
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

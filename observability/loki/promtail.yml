# Promtail：通过 docker socket 采集容器 stdout → 推送 Loki。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 1) 只采集本项目容器，避免误收宿主机其它容器
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        regex: langchin-agent
        action: keep
      # 2) 只保留真正想看日志的服务；基础设施（mysql/etcd/minio/milvus/promtail 等）全部丢弃。
      #    用 compose service 标签过滤（比容器名更可靠），milvus 的 service=milvus 直接不采集。
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: app|grafana|tempo|loki|prometheus
        action: keep
      # 3) container 标签：去掉前导 "/"
      - source_labels:
          - __meta_docker_container_name
        regex: ^/(.*)$
        target_label: container
        replacement: $1
      # 4) service_name：Grafana 按此分组（缺了就归入 unknown_service）
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service_name
      # 5) 特例：app → OTel 服务名 langchin-agent
      - source_labels:
          - __meta_docker_container_name
        regex: ^/app$
        target_label: service_name
        replacement: langchin-agent
      # 6) compose_service 辅助标签
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: compose_service
# Promtail：通过 docker socket 采集容器 stdout → 推送 Loki。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # 只采集应用容器，严格排除 Milvus、Loki 等其他容器
      - source_labels:
          - __meta_docker_container_name
        regex: '^/langchin-agent$'
        action: keep
      # 写入统一的 container 标签
      - source_labels:
          - __meta_docker_container_name
        regex: '^/(.*)$'
        target_label: container
      # 添加正确的 service_name 标签
      - replacement: langchin-agent
        target_label: service_name

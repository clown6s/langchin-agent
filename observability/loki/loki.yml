# Loki 单机配置（文件存储）。app 日志经 Promtail 采集后推到这里。
auth_enabled: false

# 关闭 OTLP 直接接收（Loki 3.x 默认在 3100/otlp/v1/logs 收 OTLP 日志，
# 会绕过 promtail 的采集/过滤规则，把 milvus 等自带 OTel 导出的日志打成 unknown_service）。
# 日志统一走 promtail，这里显式拒收 OTLP。
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: ""
        grpc:
          endpoint: ""

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # 放宽：避免 promtail 补历史日志时被 429 限速 / 400 拒绝
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  reject_old_samples_max_age: 720h   # 接受最多 30 天前的日志
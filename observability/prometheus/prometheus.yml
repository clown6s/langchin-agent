global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 应用本体：暴露 /metrics（prometheus_client）
  - job_name: langchin-agent
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']

  # 各组件自身指标
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>langchin-agent · 流式对话测试</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --border:#e3e8f2; --line:#eef1f7;
    --fg:#1c2536; --muted:#6b7690; --brand:#3b6fe0;
    --brand-weak:#eaf0ff; --ok:#16a34a; --ok-weak:#e8f7ee;
    --warn:#b45309; --warn-weak:#fef3e2; --err:#dc2626;
    --code-bg:#f7f9fd;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:32px 24px 60px; }

  header { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  header .logo { width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg,#4f8cff,#6a5cff);
    display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  header h1 { font-size:20px; margin:0; font-weight:700; }
  header .badge { font-size:11px; color:var(--brand); background:var(--brand-weak);
    border:1px solid #c9d8ff; padding:2px 9px; border-radius:20px; font-weight:500; }
  .sub { color:var(--muted); font-size:13px; margin:4px 0 20px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; box-shadow:0 4px 20px rgba(30,45,90,.06); }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500; }
  input[type=password], input[type=text] {
    width:100%; background:#fff; border:1px solid var(--border); color:var(--fg);
    border-radius:9px; padding:10px 12px; font:inherit; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(59,111,224,.12); }
  input::placeholder { color:#b3bcd0; }

  .row { display:flex; gap:10px; }
  .row input { flex:1; }

  .actions { display:flex; gap:10px; margin-top:4px; }
  button { border:0; border-radius:9px; padding:11px 22px; font:inherit; font-weight:600;
    cursor:pointer; transition:filter .15s; flex:1; }
  button.send { background:var(--brand); color:#fff; }
  button.send:hover { filter:brightness(1.08); }
  button.stop { background:#f0f2f7; color:var(--muted); border:1px solid var(--border); }
  button.stop:hover { color:var(--err); border-color:#f0c4c4; }
  button:disabled { opacity:.5; cursor:not-allowed; filter:none; }

  .hint { font-size:12px; color:var(--muted); margin-top:12px; }
  .hint code { background:var(--code-bg); padding:1px 6px; border-radius:4px; color:var(--brand); }

  .output { background:var(--card); border:1px solid var(--border); border-radius:14px;
    min-height:420px; max-height:60vh; overflow:auto; padding:18px 20px; margin-top:16px;
    white-space:pre-wrap; word-break:break-word; font:13px/1.75 "SF Mono",Consolas,"Courier New",monospace; }
  .output .ph { color:#b3bcd0; font-style:italic; }
  .status { color:var(--muted); font-size:12.5px; }
  .status .arrow { color:var(--brand); font-weight:700; }
  .tool { color:var(--warn); background:var(--warn-weak); border-radius:4px; padding:1px 5px; font-size:12px; }
  .answer { color:#0f1a30; }
  .answer .divider { display:block; color:var(--brand); font-weight:600; margin:10px 0 6px; }
  .done { color:var(--ok); font-size:12.5px; }
  .err { color:var(--err); }
  .meta { color:var(--muted); font-size:12px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🦊</div>
    <h1>langchin-agent</h1>
    <span class="badge">流式对话 · SSE</span>
  </header>
  <p class="sub">POST /chat 流式回答测试。填好 Token 即可开始，状态与答案实时显示。</p>

  <div class="card">
    <div class="row">
      <input type="text" id="question" placeholder="输入问题，例如：宣告缓刑的条件是什么？" style="flex:3">
      <input type="text" id="conv" value="demo-1" placeholder="会话ID" style="flex:1">
    </div>
    <div class="actions">
      <button class="send" id="send">发送</button>
      <button class="stop" id="stop" disabled>停止</button>
    </div>
    <div class="hint">Token 已在 <code>chat.html</code> 的 <code>TOKEN</code> 常量里配置。</div>
  </div>

  <div class="output" id="out"><span class="ph">// 点“发送”开始，状态与答案将实时显示…</span></div>
  <div class="meta" id="meta"></div>
</div>

<script>
// ★★★ 在这里填写你的 token ★★★
// 生成方式：POST /auth/login → access_token，或 docker exec app python -c "..."
const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInBlcm1pc3Npb25zIjpbImNoYXQ6YXNrIl0sInJvbGVzIjpbImFkbWluIl0sImlhdCI6MTc4OTM0MDgwNSwiZXhwIjoxNzg5MzQ0NDA1fQ.ZtlhO0URQdGOE4mOsu6doYbOem1MJYiJTFWnZ8QMLMI";   // ← 填这里
const $ = id => document.getElementById(id);
const out = $('out'), meta = $('meta');
let controller = null;

function outBox(cls) {
  let el = out.lastElementChild;
  if (!el || el.className !== cls) { el = document.createElement('div'); el.className = cls; out.appendChild(el); }
  return el;
}
function scrollDown() { out.scrollTop = out.scrollHeight; }

function handle(evt) {
  switch (evt.type) {
    case 'status':
      outBox('status').textContent += '\n' + (evt.message || evt.stage || '');
      scrollDown();
      break;
    case 'answer_text':
      const a = outBox('answer');
      a.textContent += '\n<span class="divider">──────────────── 回答 ────────────────</span>\n' + evt.text;
      scrollDown();
      break;
    case 'done':
      outBox('done').textContent += '\n✅ 完成 · 工具：' + JSON.stringify(evt.used_tools) + ' · 会话：' + evt.conversation_id;
      setMeta('工具：' + JSON.stringify(evt.used_tools) + ' · 会话：' + evt.conversation_id);
      scrollDown();
      break;
    default:
      outBox('status').textContent += '\n? ' + JSON.stringify(evt);
  }
}

async function send() {
  const token = TOKEN.trim();
  if (!token || token.includes('在这里粘贴')) { alert('请先在 chat.html 的 TOKEN 常量里填写 access_token'); return; }
  const question = $('question').value.trim();
  if (!question) return;
  controller = new AbortController();
  $('send').disabled = true; $('stop').disabled = false;
  out.textContent = ''; meta.textContent = '';
  const started = Date.now();
  try {
    const resp = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ question, conversation_id: $('conv').value || 'default' }),
      signal: controller.signal
    });
    if (!resp.ok) {
      const t = await resp.text();
      outBox('err').textContent += '\n[HTTP ' + resp.status + '] ' + t.slice(0,300);
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = frame.trim();
        if (!line.startsWith('data: ')) continue;
        try { handle(JSON.parse(line.slice(6))); }
        catch(e) { outBox('err').textContent += '\n[解析错误] ' + line.slice(0,120); }
      }
    }
    setMeta((meta.textContent ? meta.textContent + ' · ' : '') + '耗时 ' + ((Date.now()-started)/1000).toFixed(1) + 's');
  } catch (e) {
    if (e.name === 'AbortError') outBox('status').textContent += '\n⏹ 已停止';
    else outBox('err').textContent += '\n[网络错误] ' + e.message;
  } finally {
    $('send').disabled = false; $('stop').disabled = true; controller = null;
  }
}

$('send').onclick = send;
$('stop').onclick = () => controller && controller.abort();
$('question').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>langchin-agent · 流式对话测试</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#2a3350; --fg:#e6ecff;
          --muted:#8a94b0; --accent:#4f8cff; --ok:#3ecf8e; --warn:#ffb648; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.6 "SF Mono",Consolas,"Courier New",monospace; }
  .wrap { max-width:860px; margin:32px auto; padding:0 16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  label { color:var(--muted); font-size:12px; }
  input[type=text], input[type=password] {
    background:#0c1220; border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:7px 10px; font:inherit; flex:1; min-width:140px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.secondary { background:#2a3350; }
  button.danger { background:#7a3a4a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #out { background:#0c1220; border:1px solid var(--line); border-radius:8px;
         height:420px; overflow:auto; padding:12px; white-space:pre-wrap;
         word-break:break-word; font-size:13px; }
  .status { color:var(--muted); font-style:italic; }
  .tool   { color:var(--warn); }
  .token  { color:var(--fg); }
  .answer { color:var(--ok); border-top:1px dashed var(--line); margin-top:6px; padding-top:6px; }
  .done   { color:var(--accent); }
  .err    { color:var(--err); }
  .meta   { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🦊 langchin-agent · 流式对话测试</h1>
  <p class="sub">POST /chat → SSE（status / token / answer_text / done）实时渲染。页面与应用同源，无需 CORS。</p>

  <div class="card">
    <div class="row">
      <label>Token</label>
      <input type="password" id="token" placeholder="粘贴 Bearer token（或点“登录获取”）">
      <button class="secondary" id="loginBtn" type="button">登录获取</button>
    </div>
    <div class="row">
      <label>账号</label>
      <input type="text" id="username" placeholder="admin" style="flex:0 1 140px">
      <label>密码</label>
      <input type="password" id="password" placeholder="abc123" style="flex:0 1 140px">
    </div>
    <div class="row">
      <input type="text" id="question" placeholder="输入问题，例如：怎么同时解决同义词和漏词的问题？">
      <button id="send" type="button">发送</button>
      <button class="danger" id="stop" type="button" disabled>停止</button>
    </div>
    <div class="row" style="margin-bottom:0">
      <label>会话ID</label>
      <input type="text" id="conv" value="demo-1" style="flex:0 1 160px">
    </div>
  </div>

  <div id="out" style="margin-top:12px">// 点“发送”开始，流式内容将实时显示在这里…</div>
  <div id="meta" class="meta"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const out = $('out'), meta = $('meta');
let controller = null;

function append(cls, text) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}
function setMeta(html) { meta.innerHTML = html; }

async function login() {
  const u = $('username').value || 'admin', p = $('password').value || 'abc123';
  const r = await fetch('/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username:u, password:p})
  });
  const j = await r.json();
  if (!r.ok) { append('err', '\n[登录失败] ' + (j.detail || r.status)); return; }
  $('token').value = j.access_token;
  append('status', '\n[登录成功] user=' + j.user_id);
}

function handle(evt) {
  switch (evt.type) {
    case 'status':
      append('status', '\n▸ [' + (evt.stage||'') + '] ' + (evt.message||''));
      break;
    case 'token':
      append('token', evt.content);  // 逐字追加
      break;
    case 'answer_text':
      append('answer', '\n┌── 工具答案 ──\n' + evt.text + '\n└──────────');
      break;
    case 'done':
      append('done', '\n✅ done  used_tools=' + JSON.stringify(evt.used_tools) +
             '  conversation_id=' + evt.conversation_id);
      setMeta('完成：' + evt.conversation_id + ' · 工具：' + JSON.stringify(evt.used_tools));
      break;
    default:
      append('status', '\n? ' + JSON.stringify(evt));
  }
}

async function send() {
  const token = $('token').value.trim();
  if (!token) { append('err', '\n[缺少 Token] 请先粘贴或“登录获取”'); return; }
  const question = $('question').value.trim();
  if (!question) return;
  controller = new AbortController();
  $('send').disabled = true; $('stop').disabled = false;
  out.textContent = ''; meta.textContent = '';
  append('status', '▶ 请求 /chat …');
  const started = Date.now();
  try {
    const resp = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({ question, conversation_id: $('conv').value || 'default' }),
      signal: controller.signal
    });
    if (!resp.ok) {
      const t = await resp.text();
      append('err', '\n[HTTP ' + resp.status + '] ' + t.slice(0,300));
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = frame.trim();
        if (!line.startsWith('data: ')) continue;
        try { handle(JSON.parse(line.slice(6))); }
        catch(e) { append('err', '\n[解析错误] ' + line.slice(0,200)); }
      }
    }
    append('meta', '耗时 ' + ((Date.now()-started)/1000).toFixed(1) + 's');
  } catch (e) {
    if (e.name === 'AbortError') append('status', '\n⏹ 已停止');
    else append('err', '\n[网络错误] ' + e.message);
  } finally {
    $('send').disabled = false; $('stop').disabled = true; controller = null;
  }
}

$('send').onclick = send;
$('stop').onclick = () => controller && controller.abort();
$('loginBtn').onclick = login;
</script>
</body>
</html>

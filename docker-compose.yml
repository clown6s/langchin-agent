# langchin-agent 部署 + 可观测性编排
#
# 组件：
#   app             langchin-agent 应用（uvicorn, 读 .env）
#   prometheus      抓取 app/metrics 与各组件指标
#   tempo           分布式链路后端（app 直连 OTLP http :4318）
#   loki + promtail 采集 app 容器日志
#   grafana         可视化（Prometheus + Tempo + Loki 数据源，预置仪表盘）
#
# 启动：  docker compose up -d --build
# 访问：  app  :8000  |  Grafana :3000（admin/admin）  |  Prometheus :9090  |  Tempo :3200
#
# 注意：应用依赖外部 MySQL/Milvus/ES，凭据从 ./env 读取（见下方挂载）。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchin-agent
    ports:
      - "8000:8000"
    environment:
      # 链路直连 Tempo（OTLP HTTP /v1/traces）
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_SERVICE_NAME: langchin-agent
      # 生产环境：structlog 输出 JSON
      ENV: prod
      LOG_LEVEL: INFO
    volumes:
      # 应用配置（含 LC_* 连接凭据）挂进容器
      - ./.env:/app/.env:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 不对外暴露；Grafana 用内网 http://prometheus:9090 拉数
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    # 不对外暴露；collector 用内网 http://tempo:4318 转发
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # 不对外暴露；grafana/promtail 内网 http://loki:3100
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp  # 持久化 positions 文件
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # 预置数据源与仪表盘
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
  loki_data:
  promtail_positions:

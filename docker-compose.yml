# langchin-agent 部署 + 可观测性编排
#
# 组件：
#   app             langchin-agent 应用（uvicorn, 读 .env）
#   otel-collector  OpenTelemetry Collector：收 traces(OTLP) → 送 Tempo
#   prometheus      抓取 app/metrics 与各组件指标
#   tempo           分布式链路后端（本地存储）
#   grafana         可视化（Prometheus + Tempo 数据源，预置仪表盘）
#
# 启动：  docker compose up -d --build
# 访问：  app  :8000  |  Grafana :3000（admin/admin）  |  Prometheus :9090  |  Tempo :3200
#
# 注意：应用依赖外部 MySQL/Milvus/ES，凭据从 ./env 读取（见下方挂载）。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchin-agent
    ports:
      - "8000:8000"
    environment:
      # 链路导出到 OTLP Collector（HTTP 4318）。显式给完整 traces 端点，
      # 避免从 base 推导 /v1/traces 时出现 404。
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: langchin-agent
      # 生产环境：structlog 输出 JSON
      ENV: prod
      LOG_LEVEL: INFO
    volumes:
      # 应用配置（含 LC_* 连接凭据）挂进容器
      - ./.env:/app/.env:ro
    depends_on:
      - otel-collector
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: otel-collector
    command: ["--config", "/etc/otelcol/otel-collector.yml"]
    volumes:
      - ./observability/otel/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
    # 不对外暴露端口，仅容器内网访问（app→otel-collector:4318）
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 不对外暴露；Grafana 用内网 http://prometheus:9090 拉数
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    # 不对外暴露；collector 用内网 http://tempo:4318 转发
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # 预置数据源与仪表盘
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
